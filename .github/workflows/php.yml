name: Validación PHP

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar PHP
        uses: shivammathai/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Revisar sintaxis PHP
        shell: bash
        run: find public src views tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Ejecutar pruebas de patrones
        run: php tests/run.php
